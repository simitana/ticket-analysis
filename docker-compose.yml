version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - ticket-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        reservations:
          memory: 2G

  ticket-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-api
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_URL=http://ollama-server:11434
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src
    networks:
      - ticket-net
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 512M

volumes:
  ollama_data:

networks:
  ticket-net:
    driver: bridge